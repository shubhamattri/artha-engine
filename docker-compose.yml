services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artha
      POSTGRES_USER: artha
      POSTGRES_PASSWORD: ${ARTHA_DB_PASSWORD:-artha}
    ports: ["5432:5432"]
    volumes: ["artha_pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  artha_pg_data:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3EF" />
    <title>Artha · wealth engine</title>

    <!-- PWA: installable on iOS via Share → Add to Home Screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Artha" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Boot splash — shown instantly (before any JS) so a slow/failed load never looks like a
         dead white screen. React replaces #root on mount; the watchdog offers an escape hatch. */
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #F5F3EF; color: #0F7A52; z-index: 9999;
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
      }
      #boot .mark { font-size: 56px; font-weight: 800; letter-spacing: -1px;
        animation: boot-pulse 1.25s ease-in-out infinite; }
      #boot .bar { width: 132px; height: 3px; border-radius: 99px; background: #DED9D0; overflow: hidden; }
      #boot .bar > i { display: block; height: 100%; width: 40%; border-radius: 99px; background: #0F7A52;
        animation: boot-slide 1.1s ease-in-out infinite; }
      #boot .msg { font-size: 13px; color: #6b6257; display: none; }
      #boot .reload { display: none; margin-top: 4px; padding: 10px 18px; border: 0; border-radius: 12px;
        background: #0F7A52; color: #fff; font-size: 14px; font-weight: 600; }
      @keyframes boot-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.97); } }
      @keyframes boot-slide { 0% { transform: translateX(-130%); } 100% { transform: translateX(330%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark">अर्थ</div>
        <div class="bar"><i></i></div>
        <div class="msg" id="boot-msg">Taking longer than usual…</div>
        <button class="reload" id="boot-reload" onclick="arthaHardReload()">Reload</button>
      </div>
    </div>
    <script>
      // One-tap escape hatch: drop any stale service worker + caches, then reload fresh.
      window.arthaHardReload = async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); }
        } catch (e) {}
        location.reload();
      };
      // A cache-first SW shipped once and was later deleted from the repo. Deleting it there does
      // not remove it from a phone, so installed devices still serve that old shell forever and the
      // hatch above never fires (the stale build boots fine). Kill any survivor on every load.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;                       // no-op on clean devices
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () { return window.caches ? caches.keys() : []; })
            .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
            .then(function () { location.reload(); });
        }).catch(function () {});
      }
      // Watchdog: if React hasn't mounted in 7s, reveal the reload button.
      setTimeout(function () {
        if (!window.__artha_mounted) {
          var b = document.getElementById('boot-reload'), m = document.getElementById('boot-msg');
          if (b) b.style.display = 'inline-block';
          if (m) m.style.display = 'block';
        }
      }, 7000);
      // A failed JS/CSS chunk (stale cache → 404) → offer reload immediately.
      window.addEventListener('error', function (ev) {
        var t = ev && ev.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !window.__artha_mounted) {
          var b = document.getElementById('boot-reload'), m = document.getElementById('boot-msg');
          if (b) b.style.display = 'inline-block';
          if (m) { m.style.display = 'block'; m.textContent = "Couldn't load the latest version."; }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
